name: Issue Triage

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: ${{ !github.event.issue.pull_request && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Triage issue labels and missing details
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('node:path')
            const { pathToFileURL } = require('node:url')

            const triage = await import(
              pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/issue-triage.mjs')).href
            )

            const { owner, repo } = context.repo
            const issue = context.payload.issue
            const existingNames = new Set((issue.labels || []).map((label) => label.name))

            async function safeRemoveLabel(name) {
              if (!existingNames.has(name)) return
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name,
                })
              } catch (error) {
                if (error?.status !== 404) throw error
              }
            }

            if (context.eventName === 'issue_comment') {
              const comment = context.payload.comment
              if (comment?.user?.id && comment.user.id === issue.user?.id) {
                await safeRemoveLabel('needs-info')
                await safeRemoveLabel('stale')
              }
              return
            }

            const result = triage.classifyIssue({
              title: issue.title || '',
              body: issue.body || '',
              existingLabels: [...existingNames],
            })

            const repoLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            })
            const validLabelNames = new Set(repoLabels.map((label) => label.name))
            const labelsToAdd = result.labelsToAdd.filter((name) => validLabelNames.has(name))

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: labelsToAdd,
              })
            }

            for (const name of result.labelsToRemove) {
              await safeRemoveLabel(name)
            }

            if (context.payload.action === 'opened' && result.needsInfo) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100,
              })
              const alreadyReminded = comments.some((comment) =>
                (comment.body || '').includes(triage.NEEDS_INFO_MARKER),
              )
              if (!alreadyReminded) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: triage.buildNeedsInfoComment({ isSetupIssue: result.isSetupIssue }),
                })
              }
            }
