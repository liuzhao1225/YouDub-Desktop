name: Stale Issues

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-issue-labels: 'needs-info'
          days-before-issue-stale: 14
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: 'stale'
          close-issue-reason: 'not_planned'
          remove-issue-stale-when-updated: true
          stale-issue-message: |
            由于这条 Issue 长时间未收到补充信息或日志，先标记为 `stale`。如果问题在最新版本中仍然存在，欢迎随时回复补充信息以保持开启。
          close-issue-message: |
            由于标记为 `needs-info` 后一直未收到进一步回复，先自动关闭这条 Issue。如果后续升级最新版本仍遇到问题，欢迎补充诊断信息后重新打开或提交新 Issue。
